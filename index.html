<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>Quiz · FEP58 · Clase 4 · Modelos iniciales</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#0d1210;--muted:#58645e;--line:#d3dcd6;--soft:#f1f5f2;
  --acc:#00a03a;--acc-d:#00752b;--acc-l:#e6f6eb;
  --bad:#cf222e;--bad-l:#fdecec;--warn:#9a6200;--warn-l:#fff3dc;
  --blue:#0a58ca;--violet:#6a3dc8;
  --mono:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --r:10px;--sh:4px 4px 0 var(--ink);
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;min-height:100vh;background-color:#fff;
  background-image:linear-gradient(var(--soft) 1px,transparent 1px),linear-gradient(90deg,var(--soft) 1px,transparent 1px);
  background-size:22px 22px;color:var(--ink);font:500 16px/1.5 var(--mono);
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
#app{max-width:1080px;margin:0 auto;padding:18px 16px 40px;min-height:100vh;display:flex;flex-direction:column;gap:16px}
h1,h2,h3,p{margin:0}
.ico{width:1.15em;height:1.15em;flex:none;vertical-align:-.2em;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ico.spin{animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* ventana de terminal */
.term{border:1.5px solid var(--ink);border-radius:var(--r);background:#fff;box-shadow:var(--sh);overflow:hidden}
.term-bar{display:flex;align-items:center;gap:10px;padding:8px 12px;border-bottom:1.5px solid var(--ink);background:var(--soft);font-size:12px;color:var(--muted)}
.dots{display:flex;gap:6px}
.dots i{width:10px;height:10px;border-radius:50%;border:1.5px solid var(--ink);display:block}
.dots i:nth-child(1){background:#ff5f57}.dots i:nth-child(2){background:#febc2e}.dots i:nth-child(3){background:#28c840}
.term-body{padding:22px}
.hero .kicker{color:var(--acc-d);font-size:13px;font-weight:700}
.hero .kicker::before{content:'$ ';color:var(--muted)}
.hero h1{font-size:clamp(28px,6vw,52px);line-height:1.05;font-weight:800;margin:10px 0 8px;letter-spacing:-.02em}
.cursor{display:inline-block;width:.5em;height:.85em;background:var(--acc);vertical-align:-.06em;margin-left:.15em;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.hero .sub{color:var(--muted);font-size:clamp(13px,2.2vw,16px)}
.hero .sub::before{content:'// ';color:var(--acc)}

/* tarjetas y formularios */
.card{background:#fff;border:1.5px solid var(--ink);border-radius:var(--r);box-shadow:var(--sh);padding:18px}
.card h3{font-size:13px;text-transform:uppercase;letter-spacing:.07em;margin-bottom:14px;display:flex;align-items:center;gap:8px}
.narrow{max-width:520px;width:100%;margin:0 auto}
.field{display:grid;gap:6px;margin-bottom:14px}
.field label{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.07em}
.input{width:100%;border:1.5px solid var(--ink);border-radius:8px;padding:12px 14px;font:600 18px var(--mono);color:var(--ink);background:#fff;outline:none}
.input:focus{border-color:var(--acc-d);box-shadow:0 0 0 3px var(--acc-l)}
.input.code{font-size:30px;font-weight:800;letter-spacing:.3em;text-align:center}
textarea.input{min-height:150px;resize:vertical;font-size:16px;line-height:1.5}
.input:disabled{background:var(--soft)}
.hint{min-height:18px;font-size:13px;color:var(--bad);margin-top:10px}
.counter{font-size:12px;color:var(--muted);text-align:right}

/* botones */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1.5px solid var(--ink);border-radius:8px;padding:12px 18px;font:700 15px var(--mono);cursor:pointer;background:#fff;color:var(--ink);box-shadow:3px 3px 0 var(--ink);transition:transform .06s,box-shadow .06s,background .15s;text-decoration:none}
.btn:hover{background:var(--soft)}
.btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none;box-shadow:3px 3px 0 var(--ink)}
.btn.dark{background:var(--ink);color:#fff}.btn.dark:hover{background:#28322d}
.btn.acc{background:var(--acc);color:#fff}.btn.acc:hover{background:var(--acc-d)}
.btn.block{width:100%}
.btn.sm{padding:7px 12px;font-size:13px;box-shadow:2px 2px 0 var(--ink)}
.btn:focus-visible,.opt:focus-visible,.link:focus-visible{outline:3px solid var(--acc);outline-offset:3px}
.link{background:none;border:0;padding:6px 0;font:600 14px var(--mono);color:var(--ink);cursor:pointer;display:inline-flex;align-items:center;gap:8px;text-decoration:underline;text-underline-offset:3px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.row.end{justify-content:flex-end}.row.center{justify-content:center}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px;align-items:start}
.muted{color:var(--muted)}.small{font-size:13px}
.pill{display:inline-flex;align-items:center;gap:6px;border:1.5px solid var(--ink);border-radius:99px;padding:5px 12px;font-size:13px;font-weight:700;background:#fff;white-space:nowrap}
.pill.acc{background:var(--acc-l);border-color:var(--acc-d);color:var(--acc-d)}
.pill.bad{background:var(--bad-l);border-color:var(--bad);color:var(--bad)}
.pill.warn{background:var(--warn-l);border-color:var(--warn);color:var(--warn)}
.status{display:inline-flex;align-items:center;gap:8px;font-weight:700;font-size:14px}
.status.ok{color:var(--acc-d)}.status.bad{color:var(--bad)}.status.wait{color:var(--warn)}
.led{width:10px;height:10px;border-radius:50%;background:currentColor;box-shadow:0 0 0 3px color-mix(in srgb,currentColor 20%,transparent);flex:none}

/* sala docente */
.codebig{font-size:clamp(48px,12vw,88px);font-weight:800;letter-spacing:.14em;line-height:1;text-align:center;margin:4px 0 14px}
.qr{width:min(250px,72vw);margin:0 auto;padding:8px;border:1.5px solid var(--ink);border-radius:8px;background:#fff}
.qr svg{display:block;width:100%;height:auto}
.url{font-size:12px;word-break:break-all;text-align:center;color:var(--muted);margin-top:10px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1.5px solid var(--ink);border-radius:6px;padding:4px 10px;font-size:14px;font-weight:700;background:var(--acc-l);animation:pop .3s ease-out}
.chip.off{background:#fff;color:var(--muted);border-style:dashed}
@keyframes pop{from{transform:scale(.6);opacity:0}to{transform:none;opacity:1}}

/* pregunta */
.qhead{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.grow{flex:1}
.tbar{height:8px;border:1.5px solid var(--ink);border-radius:99px;overflow:hidden;background:#fff}
.tbar i{display:block;height:100%;width:100%;background:var(--acc);transition:width .25s linear}
.tbar.warn i{background:var(--bad)}
.qbox{font-size:clamp(18px,3vw,30px);font-weight:700;line-height:1.35}
.qbox .tag{display:block;font-size:12px;font-weight:700;color:var(--acc-d);text-transform:uppercase;letter-spacing:.08em;margin-bottom:10px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.opt{display:flex;align-items:center;gap:14px;text-align:left;border:1.5px solid var(--ink);border-left-width:10px;border-radius:8px;padding:14px 16px;min-height:76px;background:#fff;color:var(--ink);font:700 clamp(15px,2.1vw,20px)/1.3 var(--mono);box-shadow:3px 3px 0 var(--ink);cursor:pointer;transition:transform .06s,opacity .2s,background .15s;width:100%}
button.opt:hover{background:var(--soft)}
button.opt:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
button.opt:disabled{cursor:not-allowed;opacity:.5}
div.opt{cursor:default}
.opt .key{flex:none;width:34px;height:34px;border-radius:6px;display:grid;place-items:center;color:#fff;font-size:15px;font-weight:800}
.opt.k0{border-left-color:var(--acc)}.opt.k0 .key{background:var(--acc)}
.opt.k1{border-left-color:var(--blue)}.opt.k1 .key{background:var(--blue)}
.opt.k2{border-left-color:var(--warn)}.opt.k2 .key{background:var(--warn)}
.opt.k3{border-left-color:var(--violet)}.opt.k3 .key{background:var(--violet)}
.opt .cnt{margin-left:auto;font-size:14px;display:inline-flex;gap:6px;align-items:center;white-space:nowrap}
.opt.correct{background:var(--acc-l);border-color:var(--acc-d);border-left-color:var(--acc-d)}
.opt.dim{opacity:.35}

/* respuestas y resultados */
.center{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:14px;min-height:55vh}
.badge{width:88px;height:88px;border-radius:50%;display:grid;place-items:center;border:2px solid var(--ink);box-shadow:var(--sh);font-size:42px;animation:pop .35s ease-out}
.badge.ok{background:var(--acc);color:#fff}.badge.bad{background:var(--bad);color:#fff}
.badge.part{background:var(--warn);color:#fff}.badge.wait{background:var(--warn-l);color:var(--warn)}
.big{font-size:clamp(26px,6vw,44px);font-weight:800;line-height:1.1}
.box{border:1.5px solid var(--ink);border-radius:8px;padding:12px 16px;background:#fff;text-align:left;max-width:780px;width:100%}
.box.acc{background:var(--acc-l);border-color:var(--acc-d)}
.box .lbl{display:block;font-size:12px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin-bottom:4px}
.box.acc .lbl{color:var(--acc-d)}
.why{border-left:4px solid var(--acc);padding:4px 0 4px 12px;text-align:left;max-width:780px;width:100%}
.why::before{content:'// por qué: ';color:var(--acc-d);font-weight:800}
.rank{display:grid;gap:8px}
.rank .r{display:flex;align-items:center;gap:10px;border:1.5px solid var(--ink);border-radius:8px;padding:8px 12px;background:#fff}
.rank .r .n{width:30px;font-weight:800}
.rank .r .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:left}
.podium{display:flex;align-items:flex-end;justify-content:center;gap:10px;margin-top:6px}
.pod{flex:1;max-width:200px;border:1.5px solid var(--ink);border-radius:8px 8px 0 0;box-shadow:var(--sh);display:flex;flex-direction:column;align-items:center;padding:12px 8px;gap:4px;text-align:center;background:#fff}
.pod.p1{height:200px;background:var(--acc-l)}.pod.p2{height:160px}.pod.p3{height:130px}
.pod .pl{font-size:28px;font-weight:800}
.pod .nm{font-weight:800;word-break:break-word}
.answers{display:grid;gap:8px;max-height:48vh;overflow:auto;padding-right:4px}
.ans{border:1.5px solid var(--ink);border-left-width:8px;border-radius:8px;padding:10px 12px;display:grid;gap:6px;background:#fff}
.ans.ok{border-left-color:var(--acc)}.ans.part{border-left-color:var(--warn)}.ans.bad{border-left-color:var(--bad)}
.ans .top{display:flex;gap:8px;align-items:center;font-size:13px;flex-wrap:wrap}
.ans .top b{flex:1}
.ans .txt{white-space:pre-wrap;word-break:break-word}
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th,.tbl td{border-bottom:1px solid var(--line);padding:8px 6px;text-align:left}
.tbl th{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.tbl .num{text-align:right;white-space:nowrap}
.up{color:var(--acc-d);font-weight:800}.down{color:var(--bad);font-weight:800}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;width:100%;max-width:780px}
.tile{border:1.5px solid var(--ink);border-radius:8px;padding:12px;background:#fff;box-shadow:3px 3px 0 var(--ink);text-align:left}
.tile small{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}
.tile b{font-size:28px}
.foot{margin-top:auto;text-align:center;font-size:12px;color:var(--muted);padding-top:12px}
@media (max-width:620px){.opts{grid-template-columns:1fr}.term-body{padding:16px}.card{padding:14px}.opt{min-height:64px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

var qrcode = function() {

  //---------------------------------------------------------------------
  // qrcode
  //---------------------------------------------------------------------

  /**
   * qrcode
   * @param typeNumber 1 to 40
   * @param errorCorrectionLevel 'L','M','Q','H'
   */
  var qrcode = function(typeNumber, errorCorrectionLevel) {

    var PAD0 = 0xEC;
    var PAD1 = 0x11;

    var _typeNumber = typeNumber;
    var _errorCorrectionLevel = QRErrorCorrectionLevel[errorCorrectionLevel];
    var _modules = null;
    var _moduleCount = 0;
    var _dataCache = null;
    var _dataList = [];

    var _this = {};

    var makeImpl = function(test, maskPattern) {

      _moduleCount = _typeNumber * 4 + 17;
      _modules = function(moduleCount) {
        var modules = new Array(moduleCount);
        for (var row = 0; row < moduleCount; row += 1) {
          modules[row] = new Array(moduleCount);
          for (var col = 0; col < moduleCount; col += 1) {
            modules[row][col] = null;
          }
        }
        return modules;
      }(_moduleCount);

      setupPositionProbePattern(0, 0);
      setupPositionProbePattern(_moduleCount - 7, 0);
      setupPositionProbePattern(0, _moduleCount - 7);
      setupPositionAdjustPattern();
      setupTimingPattern();
      setupTypeInfo(test, maskPattern);

      if (_typeNumber >= 7) {
        setupTypeNumber(test);
      }

      if (_dataCache == null) {
        _dataCache = createData(_typeNumber, _errorCorrectionLevel, _dataList);
      }

      mapData(_dataCache, maskPattern);
    };

    var setupPositionProbePattern = function(row, col) {

      for (var r = -1; r <= 7; r += 1) {

        if (row + r <= -1 || _moduleCount <= row + r) continue;

        for (var c = -1; c <= 7; c += 1) {

          if (col + c <= -1 || _moduleCount <= col + c) continue;

          if ( (0 <= r && r <= 6 && (c == 0 || c == 6) )
              || (0 <= c && c <= 6 && (r == 0 || r == 6) )
              || (2 <= r && r <= 4 && 2 <= c && c <= 4) ) {
            _modules[row + r][col + c] = true;
          } else {
            _modules[row + r][col + c] = false;
          }
        }
      }
    };

    var getBestMaskPattern = function() {

      var minLostPoint = 0;
      var pattern = 0;

      for (var i = 0; i < 8; i += 1) {

        makeImpl(true, i);

        var lostPoint = QRUtil.getLostPoint(_this);

        if (i == 0 || minLostPoint > lostPoint) {
          minLostPoint = lostPoint;
          pattern = i;
        }
      }

      return pattern;
    };

    var setupTimingPattern = function() {

      for (var r = 8; r < _moduleCount - 8; r += 1) {
        if (_modules[r][6] != null) {
          continue;
        }
        _modules[r][6] = (r % 2 == 0);
      }

      for (var c = 8; c < _moduleCount - 8; c += 1) {
        if (_modules[6][c] != null) {
          continue;
        }
        _modules[6][c] = (c % 2 == 0);
      }
    };

    var setupPositionAdjustPattern = function() {

      var pos = QRUtil.getPatternPosition(_typeNumber);

      for (var i = 0; i < pos.length; i += 1) {

        for (var j = 0; j < pos.length; j += 1) {

          var row = pos[i];
          var col = pos[j];

          if (_modules[row][col] != null) {
            continue;
          }

          for (var r = -2; r <= 2; r += 1) {

            for (var c = -2; c <= 2; c += 1) {

              if (r == -2 || r == 2 || c == -2 || c == 2
                  || (r == 0 && c == 0) ) {
                _modules[row + r][col + c] = true;
              } else {
                _modules[row + r][col + c] = false;
              }
            }
          }
        }
      }
    };

    var setupTypeNumber = function(test) {

      var bits = QRUtil.getBCHTypeNumber(_typeNumber);

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[Math.floor(i / 3)][i % 3 + _moduleCount - 8 - 3] = mod;
      }

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[i % 3 + _moduleCount - 8 - 3][Math.floor(i / 3)] = mod;
      }
    };

    var setupTypeInfo = function(test, maskPattern) {

      var data = (_errorCorrectionLevel << 3) | maskPattern;
      var bits = QRUtil.getBCHTypeInfo(data);

      // vertical
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 6) {
          _modules[i][8] = mod;
        } else if (i < 8) {
          _modules[i + 1][8] = mod;
        } else {
          _modules[_moduleCount - 15 + i][8] = mod;
        }
      }

      // horizontal
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 8) {
          _modules[8][_moduleCount - i - 1] = mod;
        } else if (i < 9) {
          _modules[8][15 - i - 1 + 1] = mod;
        } else {
          _modules[8][15 - i - 1] = mod;
        }
      }

      // fixed module
      _modules[_moduleCount - 8][8] = (!test);
    };

    var mapData = function(data, maskPattern) {

      var inc = -1;
      var row = _moduleCount - 1;
      var bitIndex = 7;
      var byteIndex = 0;
      var maskFunc = QRUtil.getMaskFunction(maskPattern);

      for (var col = _moduleCount - 1; col > 0; col -= 2) {

        if (col == 6) col -= 1;

        while (true) {

          for (var c = 0; c < 2; c += 1) {

            if (_modules[row][col - c] == null) {

              var dark = false;

              if (byteIndex < data.length) {
                dark = ( ( (data[byteIndex] >>> bitIndex) & 1) == 1);
              }

              var mask = maskFunc(row, col - c);

              if (mask) {
                dark = !dark;
              }

              _modules[row][col - c] = dark;
              bitIndex -= 1;

              if (bitIndex == -1) {

                bitIndex = 7;
              }

          if (row < 0 || _moduleCount <= row) {

            inc = -inc;
            break;
          }
        }

    var createBytes = function(buffer, rsBlocks) {

      var offset = 0;

      var maxDcCount = 0;
      var maxEcCount = 0;

      var dcdata = new Array(rsBlocks.length);
      var ecdata = new Array(rsBlocks.length);

      for (var r = 0; r < rsBlocks.length; r += 1) {

        var dcCount = rsBlocks[r].dataCount;
        var ecCount = rsBlocks[r].totalCount - dcCount;

        maxDcCount = Math.max(maxDcCount, dcCount);
        maxEcCount = Math.max(maxEcCount, ecCount);

        dcdata[r] = new Array(dcCount);

        for (var i = 0; i < dcdata[r].length; i += 1) {
          dcdata[r][i] = 0xff & buffer.getBuffer()[i + offset];
        }
        offset += dcCount;

        var rsPoly = QRUtil.getErrorCorrectPolynomial(ecCount);
        var rawPoly = qrPolynomial(dcdata[r], rsPoly.getLength() - 1);

        var modPoly = rawPoly.mod(rsPoly);
        ecdata[r] = new Array(rsPoly.getLength() - 1);
        for (var i = 0; i < ecdata[r].length; i += 1) {
          var modIndex = i + modPoly.getLength() - ecdata[r].length;
          ecdata[r][i] = (modIndex >= 0)? modPoly.getAt(modIndex) : 0;
        }
      }

      var totalCodeCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalCodeCount += rsBlocks[i].totalCount;
      }

      var data = new Array(totalCodeCount);
      var index = 0;

      for (var i = 0; i < maxDcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < dcdata[r].length) {
            data[index] = dcdata[r][i];
            index += 1;
          }
        }
      }

      for (var i = 0; i < maxEcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < ecdata[r].length) {
            data[index] = ecdata[r][i];
            index += 1;
          }
        }
      }

      return data;
    };

    var createData = function(typeNumber, errorCorrectionLevel, dataList) {

      var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, errorCorrectionLevel);

      var buffer = qrBitBuffer();

      for (var i = 0; i < dataList.length; i += 1) {
        var data = dataList[i];
        buffer.put(data.getMode(), 4);
        buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );
        data.write(buffer);
      }

      // calc num max data.
      var totalDataCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalDataCount += rsBlocks[i].dataCount;
      }

var Q=[
 {id:'q1',topic:'dfd',type:'mc',time:45,
  q:'En un DFD, una flecha denominada «Hacer clic en guardar» representa un flujo de datos adecuado. ¿Qué corresponde?',
  options:['Es correcto: describe la acción del usuario','Es incorrecto: los flujos se nombran con sustantivos, no con acciones de interfaz','Es correcto si el botón existe en la pantalla','Es incorrecto porque los flujos no llevan nombre'],
  correct:1,why:'Los flujos se nombran con sustantivos que describen la información que circula (por ejemplo, «Datos del formulario guardado»), no el gesto de la interfaz.'},
 {id:'q2',topic:'ctx',type:'tf',time:45,
  q:'El diagrama de contexto de la mesa de ayuda debe incluir, dentro del proceso global, todas las tablas de la base de datos.',
  options:['Verdadero','Falso'],correct:1,
  why:'El contexto tiene un único proceso, entidades externas y flujos. Los almacenes aparecen a partir del nivel 1.'},
 {id:'q3',topic:'dfd',type:'mc',time:45,
  q:'La entidad externa «Solicitante» envía datos al almacén D1 Tickets sin pasar por un proceso. ¿Qué regla se viola?',
  options:['Ninguna: un almacén puede recibir de una entidad','Flujo directo entidad–almacén (prohibido)','Balanceo de niveles','Cardinalidad 1:N'],
  correct:1,why:'No hay flujos directos entre entidad externa y almacén, entre dos almacenes ni entre dos entidades. Siempre interviene un proceso.'},
 {id:'q4',topic:'ctx',type:'tf',time:45,
  q:'La salida «Código de ticket» existe en el contexto. Al descomponer el modelo en nivel 1, ese flujo debe reaparecer.',
  options:['Verdadero','Falso'],correct:0,
  why:'El balanceo exige que cada flujo externo del contexto reaparezca en el nivel 1, conectado a algún proceso.'},
 {id:'q5',topic:'er',type:'mc',time:45,
  q:'En el ER, id_tecnico de Ticket se definió como opcional. Un ticket sin técnico asignado:',
  options:['Rompe el modelo y hay que borrarlo','Es compatible con la opcionalidad de la clave foránea','Obliga a convertir la relación en N:N','Impide definir una clave primaria'],
  correct:1,why:'Si la FK es opcional, el ticket puede existir sin técnico. Incompatible sería si id_tecnico fuera obligatorio.'},
 {id:'q6',topic:'dfd',type:'tf',time:45,
  q:'En un DFD, un proceso puede generar un reporte sin recibir ni consultar ningún dato.',
  options:['Verdadero','Falso'],correct:1,
  why:'Cada proceso tiene al menos una entrada y una salida. Un reporte no «aparece»: sale de datos que el proceso recibió o consultó.'},
 {id:'q7',topic:'dic',type:'tf',time:45,
  q:'El atributo estado puede definirse en el diccionario con un conjunto cerrado de valores (por ejemplo: abierto, en curso, cerrado).',
  options:['Verdadero','Falso'],correct:0,
  why:'Eso es el dominio del campo: tipo más valores permitidos. El diccionario también indica si es obligatorio.'},
 {id:'q8',topic:'er',type:'mc',time:45,
  q:'Un usuario puede registrar varios tickets y cada ticket pertenece a un único solicitante. La relación es:',
  options:['1:1','1:N','N:N','0:1'],
  correct:1,why:'Un solicitante — varios tickets; cada ticket — un solo solicitante. Lectura en ambos sentidos: es 1:N.'},
 {id:'q9',topic:'bib',type:'mc',time:45,
  q:'En la biblioteca, el lector solicita un ejemplar, el bibliotecario autoriza o rechaza y la plataforma guarda el préstamo. ¿Quiénes son actores externos?',
  options:['Lector y bibliotecario (la plataforma es el sistema)','Lector, bibliotecario y plataforma','Solo el lector','Las tablas Préstamo y Ejemplar'],
  correct:0,why:'Los actores externos están fuera de la frontera. La plataforma es el sistema que se modela, no un actor.'},
 {id:'q10',topic:'bib',type:'open',time:120,
  q:'Nombra el flujo de datos que sale del lector hacia el sistema al pedir un ejemplar. Usa sustantivos, no acciones de pantalla.',
  groups:['solicitud|pedido|datos|peticion|requerimiento|informacion','prestamo|ejemplar|libro|copia'],
  avoid:'hacer clic|click|boton|ingresar a|loguear|abrir la app',
  need:.5,model:'Solicitud de préstamo del ejemplar',
  why:'Los flujos se nombran con sustantivos que describen la información, no el gesto («hacer clic en prestar»).'},
 {id:'q11',topic:'ctx',type:'mc',time:45,
  q:'El DFD de contexto «0 Gestionar préstamos» debe tener:',
  options:['Varios procesos y los almacenes D1, D2 y D3','Un único proceso y ningún almacén','Un proceso por cada tabla de la base','Solo entidades externas, sin flujos'],
  correct:1,why:'En contexto hay un proceso (el sistema visto como caja negra) y ningún almacén. Los almacenes aparecen en el nivel 1.'},
 {id:'q12',topic:'dfd',type:'mc',time:45,
  q:'¿Cuál es un nombre válido de proceso de nivel 1?',
  options:['Préstamos','Tabla ejemplar','Verificar disponibilidad','Hacer clic en prestar'],
  correct:2,why:'Los procesos se nombran con verbo + objeto. «Préstamos» es un sustantivo (más bien un almacén); el clic es interfaz, no proceso.'},
 {id:'q13',topic:'ctx',type:'num',time:75,unit:'flujos',answer:8,tol:0,
  q:'El contexto tiene 5 flujos de entrada y 3 de salida. ¿Cuántos flujos externos deben reaparecer en el nivel 1? Escribe solo el número.',
  why:'Balanceo: 5 + 3 = 8. Todos los flujos externos del contexto reaparecen en el nivel 1, cada uno ligado a un proceso.'},
 {id:'q14',topic:'dic',type:'open',time:120,
  q:'Define un campo del diccionario de Préstamo: nombre, tipo o dominio, y una regla (obligatoriedad o valores permitidos).',
  groups:['fecha|id_|estado|lector|ejemplar|devoluc|inicio|prestamo','fecha|entero|int|char|varchar|texto|enumer|dominio|date|number|boole','obligator|opcional|no nulo|not null|debe|no puede|valores|abierto|cerrado|pendiente'],
  need:.67,model:'fecha_devolucion_prevista — fecha — obligatoria y posterior a fecha_inicio',
  why:'Cada campo del diccionario tiene tipo/dominio y regla. Sin eso, el dato no se puede validar ni implementar.'},
 {id:'q15',topic:'er',type:'mc',time:45,
  q:'Un lector puede tener varios préstamos; cada préstamo pertenece a un único lector. Cardinalidad Lector–Préstamo:',
  options:['1:1','1:N','N:N','1:0'],
  correct:1,why:'Se lee en ambos sentidos: un lector puede tener 0..N préstamos; un préstamo pertenece a 1 lector.'},
 {id:'q16',topic:'er',type:'open',time:120,
  q:'Redacta la regla de negocio que impida dos préstamos abiertos del mismo ejemplar e indica en qué entidad o atributo se apoya.',
  groups:['ejemplar|libro|copia','prestamo|abierto|activo|vigente|sin devolver','uno|unico|no puede|no debe|a la vez|simultan|mismo tiempo|mas de un','estado|prestamo|ejemplar'],
  need:.5,model:'Un ejemplar no puede tener más de un préstamo con estado «abierto» a la vez. Se apoya en Préstamo.estado (o en una unicidad sobre ejemplar + estado abierto).',
  why:'Es una regla de negocio, no una decisión de tecnología. El ER la sostiene con el atributo estado o una restricción de unicidad.'},
 {id:'q17',topic:'er',type:'mc',time:45,
  q:'¿En qué se diferencian el DFD y el diagrama ER?',
  options:['El DFD modela procesos y flujos; el ER, entidades, claves y relaciones','Son el mismo diagrama con distinto nombre','El ER muestra actores externos; el DFD, claves primarias','El DFD reemplaza al diccionario de datos'],
  correct:0,why:'El DFD responde qué transforma el sistema y qué datos circulan. El ER responde qué se guarda, con qué claves y con qué cardinalidad.'},
 {id:'q18',topic:'bib',type:'mc',time:45,
  q:'Cualquiera podría consultar préstamos ajenos. ¿Por qué el DFD no resuelve eso por sí solo?',
  options:['Porque el DFD no documenta permisos ni controles de acceso; eso va en reglas, diccionario o especificación del proceso','Porque faltó dibujar más almacenes','Porque el contexto no admite entidades externas','Porque el ER no permite claves foráneas'],
  correct:0,why:'El DFD muestra flujos, no quién puede ver qué. La seguridad se documenta como regla de negocio, dominio o especificación del proceso.'}
];

/* ---------- conexión (PeerJS) ---------- */
function errText(er,c){
  var t=er&&er.type;
  if(t==='peer-unavailable')return 'No hay una sesión abierta con el código '+c+'. Revisa el código o espera a que el docente la inicie.';
  if(t==='unavailable-id')return 'ID_EN_USO';
  if(t==='network'||t==='server-error'||t==='socket-error'||t==='socket-closed')return 'No se pudo contactar el servidor de conexión. Revisa tu internet o prueba con datos móviles.';
  if(t==='browser-incompatible')return 'Este navegador no permite la conexión en vivo. Prueba con Chrome o Safari actualizados.';
  return 'No se pudo conectar ('+(t||'error')+'). Intenta de nuevo.';
}
function connect(c,asHost,H){
  var P=window.Peer||(window.peerjs&&window.peerjs.Peer);
  if(!P)return Promise.resolve('No se pudo cargar el módulo de conexión. Recarga la página.');
  return new Promise(function(res){
    var cs={},done=false,pr;
    function fin2(v){if(!done){done=true;res(v)}}
    var r={send:function(t,d,to){var m={t:t,d:d};
        if(asHost){(to?[to]:Object.keys(cs)).forEach(function(k){var x=cs[k];if(x&&x.open)try{x.send(m)}catch(e){}})}
        else if(cs.h&&cs.h.open){try{cs.h.send(m)}catch(e){}}},
      close:function(){try{pr.destroy()}catch(e){}}};
    room=r;
    try{pr=asHost?new P(ROOM+c,{config:ICE}):new P(undefined,{config:ICE})}catch(e){fin2('No se pudo iniciar la conexión.');return}
    pr.on('error',function(er){var t=errText(er,c);if(!done)fin2(t);else if(room===r&&asHost&&er.type!=='peer-unavailable'){net=t;if(st.ph==='lobby')draw()}});
    pr.on('disconnected',function(){if(room===r&&!pr.destroyed)setTimeout(function(){try{pr.reconnect()}catch(e){}},1000)});
    if(asHost){
      pr.on('open',function(){fin2(true)});
      pr.on('connection',function(cn){
        cn.on('open',function(){cs[cn.peer]=cn});
        cn.on('data',function(m){if(room===r&&m&&H[m.t])H[m.t](m.d||{},cn.peer)});
        cn.on('close',function(){delete cs[cn.peer];if(room===r&&H._close)H._close(cn.peer)});
      });
    }else{
      pr.on('open',function(){
        var cn=pr.connect(ROOM+c,{reliable:true});cs.h=cn;
        cn.on('open',function(){fin2(true)});
        cn.on('data',function(m){if(room===r&&m&&H[m.t])H[m.t](m.d||{})});
        cn.on('close',function(){if(room===r)lost()});
      });
    }
    setTimeout(function(){fin2('Tiempo agotado al conectar. Revisa tu internet o prueba con datos móviles.')},20000);
  });
}

    '<div style="overflow:auto;margin-top:14px"><table class="tbl"><thead><tr><th>Apodo</th><th class="num">Pre</th><th class="num">Post</th><th class="num">Cambio</th></tr></thead><tbody>'+
    rows.map(function(x){var a=x.pre?x.pre.cor:null,b=x.post?x.post.cor:null,dd=(a!=null&&b!=null)?b-a:null;
      return '<tr><td>'+esc(x.name)+'</td><td class="num">'+(a==null?'—':a+'/'+n)+'</td><td class="num">'+(b==null?'—':b+'/'+n)+'</td><td class="num '+(dd>0?'up':dd<0?'down':'')+'">'+(dd==null?'—':(dd>0?'+':'')+dd)+'</td></tr>'}).join('')+
    '</tbody></table></div></section>';
}
function dlResults(){
  var n=Q.length,out=[['apodo','pre_aciertos','pre_puntos','post_aciertos','post_puntos','mejora_aciertos']];
  pairRows().forEach(function(x){
    out.push([x.name,x.pre?x.pre.cor+'/'+n:'',x.pre?x.pre.pts:'',x.post?x.post.cor+'/'+n:'',x.post?x.post.pts:'',(x.pre&&x.post)?x.post.cor-x.pre.cor:'']);
  });
  download('fep58_clase4_resultados.csv',out);
}
function dlAnswers(){
  var out=[['test','pregunta','tipo','apodo','respuesta','correcta','puntaje_%','puntos']];
  ['pre','post'].forEach(function(m){
    var R=store.res&&store.res[m];if(!R)return;
    R.log.forEach(function(x){var q=Q[x.i];out.push([modeName(m),(x.i+1)+'. '+q.q,TYPE_LBL[q.type][1],x.name,answerText(q,x.v),isOk(q,x.f)?'sí':'no',Math.round(x.f*100),x.g])});
  });
  download('fep58_clase4_respuestas.csv',out);
}

function answersHtml(q){
  var ks=Object.keys(ans).sort(function(a,b){return ans[b].f-ans[a].f});
  if(!ks.length)return '<p class="muted small">Nadie respondió esta pregunta.</p>';
  return '<div class="answers">'+ks.map(function(p){
    var a=ans[p],ok=isOk(q,a.f),cls=ok?'ok':a.f>0?'part':'bad',
      tag=ok?'<span class="pill acc">'+ic('check')+'Correcta</span>':a.f>0?'<span class="pill warn">'+Math.round(a.f*100)+' %</span>':'<span class="pill bad">'+ic('x')+'Incorrecta</span>';
    return '<div class="ans '+cls+'"><div class="top"><b>'+esc(names[p]||'?')+'</b>'+tag+'<span class="small muted">+'+a.g+' pts</span>'+
      (a.f<1?'<button class="btn sm" data-ap="'+esc(p)+'" type="button">'+ic('check')+'Aceptar</button>':'')+'</div><div class="txt">'+esc(a.v)+'</div></div>';
  }).join('')+'</div>';
}

function hostDraw(){
  var q=Q[st.i],b;
  if(st.ph==='lobby'){
    var url=joinUrl();
    app.innerHTML='<div class="qhead"><span class="pill">'+ic('terminal')+'Sesión docente</span><span class="grow"></span>'+netHtml()+'</div>'+
      '<div class="grid2"><section class="card"><h3>'+ic('qr')+'Código de sala</h3><div class="codebig">'+code+'</div><div class="qr">'+qrSvg(url)+'</div>'+
      '<p class="url">'+esc(url)+'</p><div class="row center" style="margin-top:12px"><button class="btn sm" id="cpc" type="button">'+ic('copy')+'Copiar código</button><button class="btn sm" id="cpl" type="button">'+ic('copy')+'Copiar enlace</button></div></section>'+
      '<section class="card"><h3>'+ic('users')+'Conectados: <span id="pcount">'+onlineCount()+'</span></h3><div class="chips" id="players">'+playersHtml()+'</div>'+
      '<div class="row" style="margin-top:18px"><button class="btn acc" id="gp" type="button"'+(net==='ok'?'':' disabled')+'>'+ic('play')+'Iniciar pre-test</button>'+
      '<button class="btn dark" id="gq" type="button"'+(net==='ok'?'':' disabled')+'>'+ic('play')+'Iniciar post-test</button></div>'+
      '<p class="small muted" style="margin-top:12px">'+Q.length+' preguntas: '+Q.filter(function(x){return x.type==='mc'||x.type==='tf'}).length+' cerradas y '+Q.filter(function(x){return x.type==='num'||x.type==='open'}).length+' abiertas.</p>'+
      savedHtml()+'</section></div>'+compareHtml()+
      '<div class="row end"><button class="btn" id="lb" type="button">'+ic('logout')+'Cerrar sesión</button></div>';
    $('#cpc').onclick=function(){copy(code,this)};
    $('#cpl').onclick=function(){copy(url,this)};
    $('#gp').onclick=function(){if(net==='ok')go('pre')};
    $('#gq').onclick=function(){if(net==='ok')go('post')};
    if((b=$('#rt')))b.onclick=teacher;
    bindSaved();
  }else if(st.ph==='q'||st.ph==='r'){
    var rv=st.ph==='r',closed=q.type==='mc'||q.type==='tf',cnt=[0,0,0,0];
    Object.keys(ans).forEach(function(p){if(closed)cnt[ans[p].v]++});
    var body='';
    if(closed){
      body='<div class="opts">'+q.options.map(function(t,k){
        return '<div class="opt k'+k+(rv?(k===q.correct?' correct':' dim'):'')+'"><span class="key">'+LETTERS[k]+'</span><span>'+esc(t)+'</span>'+
          (rv?'<span class="cnt">'+(k===q.correct?ic('check'):'')+ic('users')+cnt[k]+'</span>':'')+'</div>'}).join('')+'</div>';
    }else if(!rv){
      body='<div class="box">'+ic(TYPE_LBL[q.type][0])+' Los estudiantes escriben la respuesta en su dispositivo'+(q.type==='num'?' (en '+esc(q.unit)+').':'.')+'</div>';
    }
    if(rv){
      if(!closed)body+='<div class="box acc"><span class="lbl">'+(q.type==='open'?'Respuesta modelo':'Respuesta correcta')+'</span>'+esc(correctText(q))+'</div>'+
        '<section class="card"><h3>'+ic('eye')+'Respuestas ('+Object.keys(ans).length+')</h3>'+answersHtml(q)+'</section>';
      body+='<p class="why">'+esc(q.why)+'</p><section class="card"><h3>'+ic('chart')+'Ranking</h3>'+rankHtml(rankPids().slice(0,5).map(function(p){return [names[p],pts[p]||0]}))+'</section>';
    }
    app.innerHTML=qHead(q,!rv,'<span class="pill">'+ic('qr')+code+'</span><span class="pill" id="acount">'+ic('users')+'<span>'+answeredCount()+' / '+onlineCount()+'</span></span>')+qBox(q)+body+
      '<div class="row end"><button class="btn" id="lb" type="button">'+ic('logout')+'Cerrar sesión</button><button class="btn '+(rv?'acc':'dark')+'" id="nx" type="button">'+
      (rv?(st.i+1<Q.length?ic('arrow')+'Siguiente':ic('trophy')+'Ver podio'):ic('eye')+'Revelar respuesta')+'</button></div>';
    $('#nx').onclick=function(){if(st.ph==='q')reveal();else next()};
    $$('[data-ap]').forEach(function(x){x.onclick=function(){approve(x.getAttribute('data-ap'))}});
    if(!rv)tick();
  }else{
    var r=rankPids(),rows=r.map(function(p){return [names[p],pts[p]||0]});
    var tot=r.length,avg=tot?Math.round(r.reduce(function(s,p){return s+(cor[p]||0)},0)/(tot*Q.length)*100):0;
    app.innerHTML='<div class="qhead"><span class="pill">'+ic('trophy')+'Podio · '+modeName(st.mode)+'</span><span class="grow"></span>'+netHtml()+'</div>'+
      podiumHtml(rows.slice(0,3))+
      '<div class="tiles" style="max-width:none"><div class="tile"><small>Participantes</small><b>'+tot+'</b></div><div class="tile"><small>Aciertos promedio</small><b>'+avg+'%</b></div></div>'+
      '<section class="card"><h3>'+ic('chart')+'Ranking</h3>'+rankHtml(rows.slice(0,10))+'</section>'+compareHtml()+
      '<div class="row end"><button class="btn sm" id="dr" type="button">'+ic('download')+'Resultados CSV</button><button class="btn sm" id="da" type="button">'+ic('download')+'Respuestas CSV</button>'+
      '<button class="btn acc" id="lob" type="button">'+ic('arrow')+'Volver a la sala</button><button class="btn" id="lb" type="button">'+ic('logout')+'Cerrar sesión</button></div>';
    $('#lob').onclick=toLobby;
    bindSaved();
  }
  if((b=$('#lb')))b.onclick=function(){if(st.ph==='lobby'||confirm('¿Cerrar la sesión? Los estudiantes se desconectarán.')){leave();home()}};
}

/* =====================================================
   ESTUDIANTE
   ===================================================== */
var SH={
  st:function(d){
    gotSt=true;clearInterval(helloT);
    var p=st;st=d;
    if(d.ph==='lobby'){mine=null;rev=null;fin=null}
    else if(d.ph==='q'&&(p.ph!=='q'||p.i!==d.i)){mine=null;rev=null}
    t0=Date.now()-(d.dur*1000-(d.left||0));
    draw();
  },
  you:function(d){if(d.v!=null&&(st.ph==='q'||st.ph==='r'))mine=d.v;if(d.rev)rev=d.rev;if(d.fin)fin=d.fin;draw()},
  rev:function(d){rev=d;if(st.ph==='q')st.ph='r';draw()},
  fin:function(d){fin=d;draw()}
};
function join(c,n){
  leave();host=false;code=c;me=n;st={ph:'lobby',i:0,mode:'pre',dur:0,left:0};mine=null;rev=null;fin=null;gotSt=false;
  loading('Conectando a la sala '+c+'…');
  connect(c,false,SH).then(function(r){
    if(r!==true){leave();msg('No se pudo unir',r,function(){join(c,n)});return}
    loading('Conectado. Esperando a la sala…');
    var tries=0,hi=function(){if(room)room.send('hello',{n:n,pid:myPid})};
    hi();helloT=setInterval(function(){if(gotSt||++tries>6){clearInterval(helloT);if(!gotSt){leave();msg('La sala no responde','El docente no respondió. Revisa el código e intenta de nuevo.',function(){join(c,n)})}}else hi()},2500);
  });
}
function lost(){
  var c=code,n=me;leave();
  msg('Se perdió la conexión','Puede ser la red o que el docente cerró la sesión. Si vuelves a entrar con el mismo apodo, conservas tu puntaje.',function(){join(c,n)});
}
function submit(v){
  if(mine!=null||st.ph!=='q'||!room)return;
  mine=v;room.send('ans',{i:st.i,v:v});draw();
}
function stuDraw(){
  var q=Q[st.i],b;
  if(st.ph==='lobby'){
    app.innerHTML='<div class="center"><div class="badge ok">'+ic('check')+'</div><p class="big">Estás dentro, '+esc(me)+'</p>'+
      '<p class="muted">Sala '+code+' · espera a que el docente inicie el cuestionario.</p><span class="status wait">'+ic('refresh','spin')+'Esperando…</span>'+
      '<button class="btn" id="lb" type="button">'+ic('logout')+'Salir</button></div>';
  }else if(st.ph==='q'){
    if(mine!=null){
      app.innerHTML=qHead(q,true)+'<div class="center" style="min-height:40vh"><div class="badge wait">'+ic('hourglass')+'</div><p class="big">Respuesta enviada</p>'+
        '<div class="box"><span class="lbl">Tu respuesta</span><div style="white-space:pre-wrap">'+esc(answerText(q,mine))+'</div></div><p class="muted">Espera a que el docente revele la respuesta.</p></div>';
      tick();
    }else{
      var body;
      if(q.type==='mc'||q.type==='tf'){
        body='<div class="opts">'+q.options.map(function(t,k){return '<button class="opt k'+k+'" type="button" data-o="'+k+'"><span class="key">'+LETTERS[k]+'</span><span>'+esc(t)+'</span></button>'}).join('')+'</div>';
      }else if(q.type==='num'){
        body='<section class="card"><div class="field"><label for="ansIn">Tu respuesta ('+esc(q.unit)+')</label><input class="input code" id="ansIn" inputmode="decimal" autocomplete="off" placeholder="0" style="letter-spacing:.06em" value="'+esc(draft[st.i]||'')+'"></div>'+
          '<button class="btn acc block" id="send" type="button">'+ic('send')+'Enviar</button></section>';
      }else{
        body='<section class="card"><div class="field"><label for="ansIn">Tu respuesta</label><textarea class="input" id="ansIn" maxlength="500" placeholder="Escribe aquí…">'+esc(draft[st.i]||'')+'</textarea><span class="counter" id="cc"></span></div>'+
          '<button class="btn acc block" id="send" type="button">'+ic('send')+'Enviar</button></section>';
      }
      app.innerHTML=qHead(q,true)+qBox(q)+body;
      $$('button.opt').forEach(function(x){x.onclick=function(){submit(+x.getAttribute('data-o'))}});
      var inp=$('#ansIn');
      if(inp){
        var cc=$('#cc'),upd=function(){draft[st.i]=inp.value;if(cc)cc.textContent=inp.value.length+' / 500'};upd();
        inp.oninput=upd;
        if(q.type==='num')inp.onkeydown=function(e){if(e.key==='Enter'){e.preventDefault();$('#send').click()}};
        $('#send').onclick=function(){
          var v=inp.value.trim();
          if(!v){inp.focus();return}
          if(q.type==='num'&&!isFinite(parseNum(v))){inp.focus();return}
          submit(v);
        };
      }
      tick();
    }
  }else if(st.ph==='r'){
    var my=rev&&rev.g?rev.g[myPid]:null,f=my?my[1]:0,gn=my?my[0]:0,ok=mine!=null&&isOk(q,f),part=!ok&&f>0;
    var cls=ok?'ok':part?'part':'bad',head=mine==null?'Sin respuesta':ok?'¡Correcto!':part?'Respuesta parcial':'Incorrecto';
    var score=rev?'<div class="row center"><span class="pill acc">+'+gn+' pts</span><span class="pill">Total '+(rev.sc[myPid]||0)+' pts</span>'+(rev.rk[myPid]?'<span class="pill">'+ic('trophy')+'Puesto '+rev.rk[myPid]+' de '+rev.n+'</span>':'')+'</div>'
      :'<span class="status wait">'+ic('refresh','spin')+'Calculando puntaje…</span>';
    app.innerHTML='<div class="center"><div class="badge '+cls+'">'+ic(ok?'check':part?'edit':'x')+'</div><p class="big">'+head+'</p>'+score+
      (mine!=null&&(q.type==='num'||q.type==='open')?'<div class="box"><span class="lbl">Tu respuesta</span><div style="white-space:pre-wrap">'+esc(answerText(q,mine))+'</div></div>':'')+
      '<div class="box acc"><span class="lbl">'+(q.type==='open'?'Respuesta modelo':'Respuesta correcta')+'</span>'+esc(correctText(q))+'</div>'+
      '<p class="why">'+esc(q.why)+'</p></div>';
  }else{
    var s=fin&&fin.sc?fin.sc[myPid]:null,cm=fin&&fin.cmp?fin.cmp[myPid]:null;
    app.innerHTML='<div class="center"><div class="badge ok">'+ic('trophy')+'</div><p class="big">Fin del '+modeName(fin?fin.mode:st.mode).toLowerCase()+'</p>'+
      (s?'<div class="tiles"><div class="tile"><small>Puesto</small><b>'+s[1]+'º</b><span class="small muted"> de '+fin.total+'</span></div><div class="tile"><small>Puntos</small><b>'+s[0]+'</b></div><div class="tile"><small>Aciertos</small><b>'+s[2]+'/'+fin.n+'</b></div></div>':'')+
      (cm?'<div class="box acc"><span class="lbl">Tu avance</span>Aciertos en el pre-test → post-test: <b>'+cm[0]+' → '+cm[1]+'</b> ('+(cm[1]-cm[0]>0?'+':'')+(cm[1]-cm[0])+')</div>':'')+
      (fin?'<section class="card" style="width:100%;max-width:780px"><h3>'+ic('trophy')+'Podio</h3>'+rankHtml(fin.top,myPid)+'</section>':'')+
      '<button class="btn" id="lb" type="button">'+ic('logout')+'Salir</button></div>';
  }
  if((b=$('#lb')))b.onclick=function(){leave();home()};
}

function draw(){
  var v=(host?'h':'s')+st.ph+st.i;
  if(host)hostDraw();else stuDraw();
  if(v!==view){view=v;window.scrollTo(0,0)}
}

document.addEventListener('keydown',function(e){
  var tg=e.target&&e.target.tagName;if(tg==='INPUT'||tg==='TEXTAREA')return;
  if(host||!room||st.ph!=='q'||mine!=null)return;
  var q=Q[st.i],n=parseInt(e.key,10);
  if(!q||(q.type!=='mc'&&q.type!=='tf')||!(n>=1&&n<=q.options.length))return;
  var bt=document.querySelector('button.opt[data-o="'+(n-1)+'"]');if(bt&&!bt.disabled)bt.click();
});
window.addEventListener('beforeunload',function(e){if(host&&room&&st.ph!=='lobby'){e.preventDefault();e.returnValue=''}});

home();
})();

</script>
</body>
</html>
